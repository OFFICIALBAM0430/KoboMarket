
services:
  app:
    build: .
    container_name: kobomarket-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URL: mongodb://mongodb:27017/kobomarket?replicaSet=rs0
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: kobomarket
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-kobomarket_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command:
      - sh
      - -c
      - ./node_modules/.bin/knex migrate:latest --knexfile knexfile.js --env development && npm start
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongodb:
    image: mongo:7
    container_name: kobomarket-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:16-alpine
    container_name: kobomarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kobomarket
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-kobomarket_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d kobomarket"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kobomarket-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo_data:
  postgres_data:
  redis_data:
